<script>
  (function () {
    var ID = "15-calendar-hours", DUR = 8.7;
    var tl = gsap.timeline({ paused: true });
    var H = window.HFHouse;
    if (H) {
      var BLUE = "#4285F4", RED = H.RED;
      var evs = gsap.utils.toArray("#f15-cal .gc-ev");
      var counter = document.getElementById("f15-counter");

      // Bed from t=0 (the card itself is DEAD STILL through the build — §6): the warm glow drifts and
      // breathes, the blue floor breathes at its own rate. #f15-glow-warm's drift (x/y) and breathe
      // (scale/opacity) used to be two separate fromTo tweens on the same element — not seek-safe (two
      // fromTo/to tweens on one element resolve differently depending on the order the playhead visited
      // them under the renderer's parallel workers, which is the flicker Tymek reported). Consolidated
      // into ONE fromTo covering all four properties.
      tl.fromTo("#f15-glow-warm", { x: -30, y: 0, scale: 0.94, opacity: 0.75 }, { x: 40, y: -18, scale: 1.08, opacity: 1.0, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo("#f15-glow-blue, #f15-glow-red", { scale: 1.06, x: 0, y: 0 }, { scale: 0.96, x: 40, y: -24, duration: DUR, ease: "sine.inOut" }, 0);

      // Pass 1 — the week fills with chore blocks, BLUE, exactly 125 ms apart from 0.3 s (0.3 → 1.175, last settles 1.42), spring-pop power3.out, no bounce.
      tl.set(evs, { backgroundColor: BLUE }, 0);
      evs.forEach(function (el, i) {
        tl.fromTo(el, { opacity: 0, scale: 0.55, transformOrigin: "50% 50%" },
                      { opacity: 1, scale: 1, duration: 0.24, ease: "power3.out" }, 0.3 + i * 0.125);
      });

      // The counter (counting-dynamic-scale × house odometer): hidden until 1.6; digits roll with rate blur 1.6 → 3.0 while the whole number grows 0.55 → 1;
      // locks land right→left on the spoken "8 to 10 hours". The static suffix "/ week" gets its own beat after the count lands.
      tl.set(counter, { opacity: 0 }, 0);
      tl.set("#f15-suffix", { opacity: 0 }, 0);
      tl.fromTo(counter, { scale: 0.55 }, { scale: 1, duration: 1.4, ease: "power3.out", immediateRender: false }, 1.6);
      H.odometer(tl, counter, 1.6, 2.6, "8–10 h", { hold: 1.0 });   // static "0–0 h" 1.6–2.6, counts up to 4.2
      tl.fromTo("#f15-suffix", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 4.25);

      // Camera: waits for the build + count, then pushes 1.00 → 1.10 (3.2–4.6); then the §6 slow hold push to the cut.
      H.push(tl, "#f15-stage", 4.25, 0.9, 1.00, 1.10, "900px 540px");
      H.push(tl, "#f15-stage", 5.15, DUR - 5.15, 1.10, 1.115, "900px 540px");

      // Pass 2 — "you still have to run your business" (≈6.2 s): the WHOLE week flips red in one 133 ms swap; the ground's light follows.
      H.swap(tl, evs, 6.2, { backgroundColor: RED });
      tl.to("#f15-glow-blue", { opacity: 0, duration: 0.133, ease: "none" }, 6.2);
