<template>
<style>
  #root { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; font-family: var(--hf-title); }
  /* Untimed bed layers (ground, glow, brandmark) are siblings of the stage, never inside it (house rule
     §10): nesting them in the camera-transformed stage makes the background slide/scale with the camera
     move and can open a gap at the frame edge that another slot shows through — this was scene 13's
     "clipped top + stray text" bug and scene 19's "border/background disappears randomly", both fixed
     by moving these three layers out. The camera world is transparent (bgCss:"transparent", bg:null) and
     bakes only the artifact card; the DOM ground/glow/mark show through the blur canvas during the leg. */
  #f14-mark { left: -160px; top: 380px; width: 1040px; height: 730px; }
  #f14-mark img { width: 100%; height: 100%; object-fit: contain; }
  #f14-glow { left: 1120px; top: -200px; width: 1000px; height: 760px; background: radial-gradient(circle, rgba(255,166,102,0.32) 0%, rgba(255,166,102,0) 65%); }
  /* The real vidIQ Research/Keywords screen (1920x1080), cropped so the presenter PiP (bottom-right, source y>~714) never enters frame. */
  #f14-shot { left: 260px; top: 290px; width: 1400px; height: 500px; transform: rotate(-1deg); background: #000; }
  #f14-shot img { position: absolute; left: 0; top: 0; width: 1400px; height: 788px; object-fit: fill; }
  /* Fixed HUD text (outside the stage, never camera-transformed): moved off the vidIQ top search
     bar down to the empty dark ground bottom-right, beside the bracket + downward arrow it reads
     with once the grind settles — verified empty of UI content across the whole settled window.
     z-index above the blur canvas (40, set inline by H.camera) AND the vignette (45, house.css):
     without it the element sits at the implicit z-index:auto/0 stacking level, so the opaque bake
     canvas — which covers the full frame and outranks any auto-stacked sibling regardless of DOM
     order once it has a positive z-index — painted OVER the handwriting for the whole 0.6-5.4 leg.
     The entrance (starting at 1.6, finishing well under 3s) was rendering the whole time, just
     hidden behind the canvas; only once the leg ended at 5.4 did the ALREADY-FULLY-WRITTEN text
     appear, so the only visible change looked like the 7.5s exit — no visible entrance. */
  #f14-hand { left: 1520px; top: 740px; font-size: 50px; transform: rotate(-3deg); z-index: 46; }
</style>
<div data-hf-id="f14-root" id="root" class="hf-dark" data-composition-id="14-vidiq-grind" data-width="1920" data-height="1080">
  <div data-hf-id="f14-ground" class="hf-ground-dark"></div>
  <div data-hf-id="f14-mark" id="f14-mark" class="hf-brandmark"><img data-hf-id="f14-markimg" id="f14-markimg" src="assets/logos/youtube.svg" alt=""></div>
  <div data-hf-id="f14-glow" id="f14-glow" class="hf-glow"></div>

  <div data-hf-id="f14-stage" id="f14-stage" class="hf-stage">
    <div data-hf-id="f14-shot" id="f14-shot" class="hf-shot">
      <img data-hf-id="f14-img" id="f14-img" src="assets/lifted/vidiq-965.png" alt="">
    </div>
    <svg data-hf-id="f14-marks" class="hf-marks" viewBox="0 0 1920 1080">
      <path data-hf-id="f14-outline" id="f14-outline" />
      <path data-hf-id="f14-arrow-shaft" id="f14-arrow-shaft" />
      <path data-hf-id="f14-arrow-head" id="f14-arrow-head" />
    </svg>
  </div>
  <canvas data-hf-id="f14-gl" id="f14-gl" class="hf-gl"></canvas>
  <div data-hf-id="f14-vig" class="hf-vignette"></div>

  <div data-hf-id="f14-hand" id="f14-hand" class="hf-hand">next few months…</div>
</div>
<script>
  (function () {
    var ID = "14-vidiq-grind", DUR = 8.5;
    var tl = gsap.timeline({ paused: true });
    var H = window.HFHouse;
    if (H) {
      var img = document.getElementById("f14-img"), markImg = document.getElementById("f14-markimg");
      // Shot geometry (design coords) — shared by the DOM .hf-shot and the bake. IMG_W/IMG_H keep the
      // source's own aspect (0.7292x) so the crop stays undistorted; the container's height (500) then
      // clips off everything below source y≈686 — safely above the presenter PiP, which starts at y≈714.
      var SX = 260, SY = 290, SW = 1400, SH = 500, ROT = -1, R = 14, IMG_W = 1400, IMG_H = 788;

      // Lit ground moves from t=0 (standing feedback) — ONE continuous fromTo per element across the
      // whole scene (seek-safe: two fromTo/to tweens on the same element resolve differently depending
      // on the order the playhead visited them under the renderer's parallel workers, which flickered
      // here; see lib/house.js push() comment). These are DOM siblings of the stage (not children), so
      // they show through the transparent-world blur canvas during the leg exactly as-is — no bake sync needed.
      tl.fromTo("#f14-glow", { scale: 0.90, opacity: 0.70 }, { scale: 1.08, opacity: 1.0, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo("#f14-mark", { x: 0, y: 0, rotation: -6 }, { x: -46, y: 32, rotation: -2, duration: DUR, ease: "sine.inOut" }, 0);

      function rr(ctx, x, y, w, h, r) {
        ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
      }
      // §8c camera: hold on the search bar / score cards, one long leg grinding down into the table
      // (0.6→5.4, ≈14%/s — within the 7-16%/s band), then a slow settle push under the final hold.
      H.camera(tl, {
        stage: document.getElementById("f14-stage"), canvas: document.getElementById("f14-gl"),
        bgCss: "transparent", bg: null, dur: DUR, K: 1.5, preset: "medium",
        // Transparent world: only the artifact card is baked. The ground, glow and brandmark are DOM
        // layers outside the camera stage; they show through the blur canvas, so the leg handoffs are
        // exact by construction (matches 11-llm-citation.html's pattern).
        bake: function (ctx) {
          // the shot: rotated rounded card, image cropped so the PiP (source y>~714) never enters the bake
          ctx.save(); ctx.translate(SX + SW / 2, SY + SH / 2); ctx.rotate(ROT * Math.PI / 180);
          ctx.fillStyle = "#000"; ctx.shadowColor = "rgba(0,0,0,0.55)"; ctx.shadowBlur = 110; ctx.shadowOffsetY = 48; rr(ctx, -SW / 2, -SH / 2, SW, SH, R); ctx.fill();
          ctx.shadowColor = "rgba(0,0,0,0.35)"; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8; ctx.fill();
          ctx.shadowColor = "rgba(0,0,0,0)"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
          rr(ctx, -SW / 2, -SH / 2, SW, SH, R); ctx.clip();
          ctx.drawImage(img, -SW / 2, -SH / 2, IMG_W, IMG_H);
          // DS card chrome (hairline + orange glow-bar on the top edge) — matches what .hf-shot::before/
          // ::after paints in the DOM during holds, so the border doesn't blink at the leg boundaries
          // (same fix as scene 13; see HFHouse.bakeImage's chrome branch for the reference values).
          ctx.save(); ctx.lineWidth = 1; ctx.strokeStyle = "#262626"; ctx.strokeRect(-SW / 2 + 0.5, -SH / 2 + 0.5, SW - 1, SH - 1); ctx.restore();
          var g1 = ctx.createLinearGradient(-SW / 4, 0, SW / 4, 0); g1.addColorStop(0, "rgba(249,115,22,0)"); g1.addColorStop(0.5, "rgba(249,115,22,0.5)"); g1.addColorStop(1, "rgba(249,115,22,0)");
          ctx.save(); ctx.filter = "blur(8px)"; ctx.fillStyle = g1; ctx.fillRect(-SW / 4, -SH / 2 - 1, SW / 2, 8); ctx.restore();
          var g2 = ctx.createLinearGradient(-SW / 4, 0, SW / 4, 0); g2.addColorStop(0, "rgba(251,146,60,0)"); g2.addColorStop(0.5, "rgba(251,146,60,0.9)"); g2.addColorStop(1, "rgba(251,146,60,0)");
          ctx.save(); ctx.fillStyle = g2; ctx.fillRect(-SW / 4, -SH / 2, SW / 2, 1); ctx.restore();
          ctx.restore();
        },
        keys: [
          { t: 0.0, cx: 960, cy: 370, z: 1.05 },
          { t: 0.6, cx: 960, cy: 370, z: 1.05 },   // hold on the search bar / score cards
          { t: 5.4, cx: 960, cy: 690, z: 1.32 },   // the grind: down through the header into the rows
          { t: DUR, cx: 960, cy: 700, z: 1.36 }    // slow settle push under the hold
        ],
        legs: [[0.6, 5.4]]
      });

      // "next few months…" writes itself in the top-right margin — OUTSIDE the stage, so it never enters
      // the camera blur (see the #f14-hand z-index note in <style>: it must also outrank the bake canvas
      // in paint order, or the entrance during the 0.6-5.4 leg is invisible).
      H.handwrite(tl, document.getElementById("f14-hand"), 1.6, 67);
      // Exit at 7.5: after the outline (lands 6.15) and arrow (shaft+head land 6.7) have both settled,
      // and ~1s before the DUR 8.5 cut — leaves a clean beat for the hard cut to the speaker. Element is
      // outside the stage (never in the bake), so no bake change is needed to respect this exit.
      // Explicit fromTo (not a bare .to()) so the start value is a hard-coded 1, not an implicit read of
      // whatever the DOM happens to hold at first render — the same explicit-values discipline as the
      // consolidated glow/mark tweens above.
      tl.fromTo("#f14-hand", { opacity: 1 }, { opacity: 0, duration: 0.133, ease: "none", immediateRender: false }, 7.5);

      // Pass 2, after the grind lands: a rough red outline groups the whole keyword table, then a red
      // arrow traces the scroll direction down beside it (both live inside the stage, in the final settled pose).
      var outline = document.getElementById("f14-outline");
      outline.setAttribute("d", H.outlinePath(292, 648, 1172, 140, 4));
      H.draw(tl, outline, 5.6, 0.55);
      var a = H.arrowPath(1500, 655, 1500, 780, 34);
      var shaft = document.getElementById("f14-arrow-shaft"), head = document.getElementById("f14-arrow-head");
      shaft.setAttribute("d", a.shaft); head.setAttribute("d", a.head);
      H.draw(tl, shaft, 6.2, 0.45);
      H.draw(tl, head, 6.55, 0.15);
    }
    window.__timelines = window.__timelines || {};
    window.__timelines[ID] = tl;
  })();
</script>
</template>
