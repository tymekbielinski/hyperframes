<script>
  (function () {
    var ID = "18-calendar-month", DUR = 8.6;
    var tl = gsap.timeline({ paused: true });
    var H = window.HFHouse;
    if (H) {
      var pips = gsap.utils.toArray("#f18-cal .gc-pip");   // DOM order = chronological (one pip per cell, row-major)
      var counter = document.getElementById("f18-counter");

      // Bed from t=0 (the card itself is DEAD STILL through the build — §6): the warm glow drifts and
      // breathes, the blue floor breathes at its own rate. ONE fromTo per element — two fromTo tweens
      // on the same element (drift + breathe, as this used to be split) are not seek-safe: the renderer
      // splits frames across parallel workers with independent seek histories, so alternate frames can
      // resolve the two tweens differently and the layer appears to flicker/change mid-scene. Combined
      // into a single tween carrying all four animated properties.
      tl.fromTo("#f18-glow-warm", { x: -30, y: 0, scale: 0.94, opacity: 0.75 },
        { x: 40, y: -18, scale: 1.08, opacity: 1.0, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo("#f18-glow-blue", { scale: 1.06, x: 0, y: 0 }, { scale: 0.96, x: 40, y: -24, duration: DUR, ease: "sine.inOut" }, 0);

      // Pass 1 — 12 Growth Calls land day after day, exactly 125 ms apart from 0.4 s (0.4 → 1.775, last settles 2.02), spring-pop power3.out, no bounce.
      pips.forEach(function (el, i) {
        tl.fromTo(el, { opacity: 0, scale: 0.55, transformOrigin: "50% 50%" },
                      { opacity: 1, scale: 1, duration: 0.24, ease: "power3.out" }, 0.4 + i * 0.125);
      });

      // The counter (counting-dynamic-scale × house odometer): hidden until 2.2; digits roll with rate blur 2.2 → 3.6 while the number grows 0.55 → 1;
      // the "0" locks at 2.97, the "1" at 3.6 — on the spoken "10 plus". The label gets its own beat after the lock.
      tl.set(counter, { opacity: 0 }, 0);
      tl.set("#f18-label", { opacity: 0 }, 0);
      tl.fromTo(counter, { scale: 0.55 }, { scale: 1, duration: 1.4, ease: "power3.out", immediateRender: false }, 1.9);
      H.odometer(tl, counter, 1.9, 2.3, "10+", { hold: 1.0 });   // static "0+" 1.9–2.9, counts to 4.2 (ring draws 4.3)
      tl.fromTo("#f18-label", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 3.6);

      // Pass 2 — the red ring draws around the locked number (≈4.0 → 4.55), marker style.
      document.getElementById("f18-ring").setAttribute("d", H.ringPath(1580, 470, 212, 122, 3));
      H.draw(tl, document.getElementById("f18-ring"), 4.3, 0.55);

      // Camera: waits for the build, count and ring, then pushes 1.00 → 1.10 (4.5–6.5); then the §6 slow hold push to the cut, glow still breathing.
      H.push(tl, "#f18-stage", 4.9, 1.6, 1.00, 1.10, "1000px 540px");
      H.push(tl, "#f18-stage", 6.5, DUR - 6.5, 1.10, 1.115, "1000px 540px");
